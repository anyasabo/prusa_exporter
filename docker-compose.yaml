networks:
  pubel:

volumes:
  grafana_data:
  prometheus_data:
  loki_data:

services:
  grafana:
    image: grafana/grafana:12.2@sha256:d2ac2dae86601550e941f7e1c0b4b7e1f21fadebfa5956ba06fe0b3a64de7cf4
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_PLUGINS_PREINSTALL=volkovlabs-image-panel, betatech-qrcode-panel, grafana-polystat-panel
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    networks:
      - pubel
    volumes:
      - ./docs/config/grafana/provisioning:/etc/grafana/provisioning
      - ./docs/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

  exporter:
    image: ghcr.io/anyasabo/prusa_exporter:latest@sha256:ce62bf0e696f54dedf663a8c8d239864eb408bf4ab5876d6ef62248f5a0c103a
    container_name: exporter
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./docs/config/prusa.yml
        target: /etc/prusa_exporter/prusa.yml
        read_only: true
    ports:
      - "10009:10009"
      - "8514:8514/udp"
    command:
      - "--config.file=/etc/prusa_exporter/prusa.yml"
      # In a container, the exporter cannot see the address of the host. The printer
      # sends its UDP metrics to this address. Example: HOST_IP=192.168.1.5 docker compose up
      - "--udp.ip-override=${HOST_IP:?set HOST_IP to the LAN address of this host}"
      - "--loki.push-url=http://loki:3100/loki/api/v1/push"
    depends_on:
      - prometheus
    networks:
      - pubel

  prometheus:
    image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    container_name: prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./docs/config/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - pubel

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./docs/config/loki.yaml:/etc/loki/loki.yaml
      - loki_data:/loki
    networks:
      - pubel