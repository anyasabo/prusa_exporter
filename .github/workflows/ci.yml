name: ci

on:
  push:
    branches: [main, fork]
  pull_request:
  workflow_dispatch:
  # Weekly: new advisories appear with no change to the code.
  schedule:
    - cron: "37 4 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise installs the tool versions of mise.toml, the same as on a local machine.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: mise run ci
      # A new advisory must not fail an unrelated change: report only.
      - run: mise run vulncheck
        continue-on-error: true
      - run: mise run fuzz
        env:
          FUZZTIME: 20s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
      - run: mise run release-dry-run
