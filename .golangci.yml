version: "2"

linters:
  # All linters, except the ones below. A new golangci-lint version can add linters:
  # each one is on at once, and its findings fail the lint until we fix or disable it.
  default: all
  disable:
    # Style rules that the Go ecosystem does not use widely.
    # exhaustruct_v5 is on only for the Options types: see its settings.
    - exhaustruct # Deprecated: exhaustruct_v5 replaces it.
    - funcorder # The order of methods in a file.
    - lll # The line length. gofumpt formats the code.
    - nlreturn # A blank line before each return.
    - noinlineerr # Forbids "if err := f(); err != nil".
    - nonamedreturns # Forbids named results, also for documentation.
    - tagalign # The alignment of struct tags.
    - varnamelen # Short names are idiomatic in Go.
    - wsl # Blank lines between statements.
    - wsl_v5
    # Rules that do not fit this code.
    - depguard # Needs a list of allowed modules. go-licenses checks the licenses.
    - gomodguard # Deprecated. gomodguard_v2 is on, but with no settings it checks nothing.
    - err113 # The config errors give the field and the value. Nothing compares them.
    - forcetypeassert # Each case is an idiom: http.DefaultTransport.(*http.Transport), sync.Pool.Get().(*T).
    - gochecknoglobals # Prometheus descriptors and metrics are package variables by convention.
    - goconst # Flags the API paths and the label values, which are clearer as literals.
    - ireturn # Flags generic functions and prometheus.Gatherer.
    - mnd # Flags buckets, ports and timeouts, which are clearer as literals.
    - tagliatelle # The YAML keys are the config format of upstream.
    - testpackage # The tests use the unexported functions.
    # Size and complexity limits: the long functions are table tests and one parser.
    - cyclop
    - funlen
    - gocognit
  settings:
    exhaustruct_v5:
      # run() in main.go copies each setting of the config into these structs. A new
      # field that run() does not set would be a setting that does nothing.
      explicit-mode: true
      enforce-patterns:
        - '^github\.com/anyasabo/prusa_exporter/v3/internal/.+\.(Gcode)?Options$'
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      default-signifies-exhaustive: true
    promlinter:
      strict: true
    wrapcheck:
      # Wrap the errors from outside the module. Our packages wrap their own errors.
      ignore-package-globs:
        - github.com/anyasabo/prusa_exporter/v3/*
      extra-ignore-sigs:
        # The *url.Error of Client.Do has the method and the URL.
        - (*net/http.Client).Do(
        # The group returns the errors of our own functions.
        - (*golang.org/x/sync/errgroup.Group).Wait(
        # A RoundTripper that wraps another one passes the error through.
        - (net/http.RoundTripper).RoundTrip(
    sloglint:
      kv-only: true
      # The keys are the ECS constants of internal/logging.
      no-raw-keys: true
      no-global: all
      static-msg: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # The tests set only the options that they test.
      - path: _test\.go
        linters:
          - exhaustruct_v5

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/anyasabo/prusa_exporter/v3
