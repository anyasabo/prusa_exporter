version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - promlinter
    - revive
    - sloglint
    - thelper
    - tparallel
    - unconvert
    - usestdlibvars
    - usetesting
  settings:
    promlinter:
      strict: true
    sloglint:
      kv-only: true
      no-global: all
      static-msg: true
      key-naming-case: snake
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/anyasabo/prusa_exporter
