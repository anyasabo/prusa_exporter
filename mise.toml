# Tool versions and tasks for local development and CI. CI runs the same tasks.
# Install the tools: `mise install`. List the tasks: `mise tasks`.
# Renovate keeps the versions current.

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
goreleaser = "2.20.3"
# goreleaser uses syft for the SBOMs.
syft = "1.57.2"
actionlint = "1.7.12"
# actionlint checks the run: steps of the workflows with shellcheck, if shellcheck is installed.
shellcheck = "0.11.0"
zizmor = "1.33.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.10.0"
# go-licenses checks that each dependency has a license that AGPL-3.0 allows.
"go:github.com/google/go-licenses/v2" = "2.0.1"
# promtool checks and tests the alert rules.
"aqua:prometheus/prometheus" = "3.16.0"

[tasks.fmt]
description = "Format the Go code"
run = "golangci-lint fmt ./..."

[tasks.lint]
description = "Run the linters and check that go.mod is tidy"
run = [
  "golangci-lint run ./...",
  "go mod tidy -diff",
  "goreleaser check --quiet",
  "actionlint",
  "zizmor --quiet .github",
  "promtool check rules alerts/prusa_exporter.rules.yml",
]

[tasks.test-alerts]
description = "Run the unit tests of the alert rules"
run = "promtool test rules alerts/prusa_exporter.test.yml"

[tasks.vulncheck]
description = "Check the dependencies for known vulnerabilities (CI reports it, it does not fail the build)"
run = "govulncheck ./..."

# The exporter is AGPL-3.0-only. Allowed: permissive licenses, MPL-2.0, LGPL, GPL-3.0 and
# AGPL-3.0. Not allowed: GPL-2.0-only (it cannot be combined with AGPL-3.0) and unknown licenses.
[tasks.licenses]
description = "Check the licenses of the dependencies and write third_party_licenses.csv"
# pipefail: without it, the grep that hides the klog warnings would hide a failed check.
# "|| true": grep exits 1 when no line is left, which is a pass.
shell = "bash -o pipefail -c"
run = [
  "go-licenses check ./... --allowed_licenses=0BSD,Apache-2.0,BSD-2-Clause,BSD-3-Clause,CC0-1.0,ISC,MIT,MPL-2.0,Unlicense,Zlib,LGPL-2.1,LGPL-3.0,GPL-3.0,AGPL-3.0 2>&1 | { grep -v '^W[0-9]' || true; }",
  "go-licenses report ./... --ignore github.com/anyasabo/prusa_exporter/v3 > third_party_licenses.csv 2>/dev/null",
]

[tasks.test]
description = "Run the tests with the race detector and coverage"
run = "go test -race -shuffle=on -coverprofile=coverage.out ./..."

[tasks.fuzz]
description = "Run each fuzz test for a short time (FUZZTIME, default 30s)"
run = '''
for f in FuzzParsePoint FuzzParseMessage FuzzHandleGather; do
  go test -run '^$' -fuzz "^$f\$" -fuzztime "${FUZZTIME:-30s}" -parallel 2 ./internal/udp
done
'''

[tasks.ci]
description = "Run all checks of CI"
depends = ["lint", "licenses", "test", "test-alerts"]

[tasks.build]
description = "Build the binary for this platform into dist/"
run = "goreleaser build --snapshot --clean --single-target"

[tasks.release-dry-run]
description = "Build all binaries, checksums and SBOMs into dist/, with no publish and no image"
run = "goreleaser release --snapshot --clean --skip=publish,ko"

[tasks.run]
description = "Run the exporter with ./prusa.yml"
run = "go run . --config.file=prusa.yml"
